syntax = "proto3";

package ommx.v2;

import "ommx/v1/function.proto";
import "ommx/v1/instance.proto";
import "ommx/v2/common.proto";
import "ommx/v2/constraint.proto";
import "ommx/v2/decision_variable.proto";
import "ommx/v2/named_function.proto";

// Objective semantics used when evaluating solver output.
//
// `sense` and `function` form one inseparable pair: together they describe
// how Solution and SampleSet objective values are presented to users, while
// the root's objective and sense describe the active formulation sent to a
// solver. In a ParametricInstance, `function` may reference parameter IDs;
// those references are materialized together with the active formulation.
// Absence means the active sense and objective are also the output semantics.
// The pair may equal the active pair when this payload exists only to record
// that active-formulation optimality does not transport.
// Its referenced IDs are not added to the solver-used set. The function is
// evaluated only after the full decision-variable state, including fixed,
// irrelevant, and dependent values, is populated.
message OutputObjective {
  ommx.v1.Instance.Sense sense = 1;
  ommx.v1.Function function = 2;

  // Whether backend optimality for the active formulation also proves
  // optimality for this output objective after state reconstruction.
  //
  // This compares objective orderings over candidate states of the active
  // formulation. It does not assert feasibility or optimality with respect to
  // removed constraints.
  //
  // `false` is conservative: it means that such a proof is not available,
  // not that the reconstructed state is known to be suboptimal.
  bool preserves_optimality = 3;
}

// Validated optimization problem serialization root.
message Instance {
  repeated Feature required_features = 1;
  ommx.v1.Instance.Description description = 2;
  DecisionVariableTable decision_variables = 3;
  ommx.v1.Function objective = 4;
  RegularConstraintCollection regular_constraints = 5;
  ommx.v1.Instance.Sense sense = 6;
  ommx.v1.Parameters parameters = 7;
  IndicatorConstraintCollection indicator_constraints = 8;
  OneHotConstraintCollection one_hot_constraints = 9;
  Sos1ConstraintCollection sos1_constraints = 10;
  map<uint64, ommx.v1.Function> decision_variable_dependency = 11;
  NamedFunctionTable named_functions = 12;
  map<string, string> annotations = 13;
  // Inactive objective definition evaluated after full state population.
  // When absent, `sense` and `objective` are also the output semantics.
  OutputObjective output_objective = 14;
}
