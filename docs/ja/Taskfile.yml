version: '3'

tasks:
  default:
    cmds:
      - task: build
      - task: open

  build:
    desc: Build the ja Book from the prepared environment
    cmds:
      - uv run --no-sync sphinx-build -b html -W --keep-going . _build/html

  test:
    desc: Execute examples and validate links in the ja Book
    env:
      OMMX_NB_EXECUTION: force
    cmds:
      - task: build
      - uv run --no-sync python ../scripts/check-book-entry-links.py ja _build/html

  open:
    desc: Open the built ja Book
    cmds:
      - uv run --no-sync python -m webbrowser 'file://{{.ROOT_DIR}}/docs/ja/_build/html/index.html'
