# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

sphinx:
  configuration: docs/ja/conf.py
  fail_on_warning: true

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      # Override the repository's Python 3.10 pin for SDK development.
      - uv venv --python 3.12 "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      # API rendering reads sources and generated metadata without the compiled SDK.
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --python 3.12 --frozen --only-group docs --no-install-workspace
