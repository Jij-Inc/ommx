[tool.uv]
# Keep the workspace lock on 0.12.0 while the intermittent OpenJij 0.12.1
# test-book kernel termination is investigated.
constraint-dependencies = ["openjij==0.12.0"]

[tool.uv.sources]
ommx = { workspace = true }
ommx-highs-adapter = { workspace = true }
ommx-pyscipopt-adapter = { workspace = true }

# JijModeling 2.4.1 is used in the Experiment tutorial only for its
# Problem protobuf codec. Its published metadata still caps OMMX at <3,
# so relax that transitive bound for this workspace's dev lock.
[[tool.uv.dependency-metadata]]
name = "jijmodeling"
version = "2.4.1"
requires-python = ">=3.11,<4"
requires-dist = [
  "numpy",
  "ommx>=2.0.0,<4.0.0",
  "orjson>=3.8.0,<4.0.0",
  "pandas",
  "typing-extensions",
]

[tool.uv.workspace]
members = ["python/ommx", "python/ommx-*-adapter"]

# Keep development-only dependencies at the workspace root. Workspace members
# declare only their runtime and build dependencies.
[dependency-groups]
lint = [
  "ruff>=0.16.0",
]
typecheck = [
  "pyright>=1.1.394",
]
test = [
  "markdown-code-runner>=2.1.0",
  "pytest>=8.3.4",
  "pytest-github-actions-annotate-failures",
  "syrupy>=4.7.2",
]
benchmark = [
  { include-group = "test" },
  "pytest-codspeed>=4.5.0",
]
build = [
  "cibuildwheel",
  "maturin>=1.14.1,<2.0.0",
]
# Runtime, doctest adapters, and tools required by the complete SDK test suite.
sdk-test = [
  "ommx",
  "ommx-highs-adapter",
  "ommx-pyscipopt-adapter",
  { include-group = "benchmark" },
  { include-group = "docs" },
  { include-group = "build" },
  { include-group = "typecheck" },
]
maintenance = [
  "tomlkit>=0.13.2",
]
docs = [
  "matplotlib>=3.10.7",
  "myst-nb>=1.0.0",
  "sphinx>=7.4.7",
  "sphinx-autoapi>=3.5.0",
  "sphinx-book-theme>=1.1.4",
  "sphinxcontrib-katex>=0.9.11",
  "tomlkit>=0.13.2",
]
# Used only when executing the Book's Experiment tutorial.
tutorials = [
  "jijmodeling>=2.4.1,<3.0.0; python_version >= '3.11'",
]
release = [
  "twine>=6.0.0,<7.0.0",
]
dev = [
  { include-group = "sdk-test" },
  { include-group = "lint" },
  { include-group = "maintenance" },
  { include-group = "tutorials" },
  { include-group = "release" },
]

[tool.pytest.ini_options]
markers = [
  "benchmark: performance benchmark collected by pytest-codspeed",
  "benchmark_guardrail: persistent regression guardrail run on ready PRs, main, and release tags",
  "benchmark_diagnostic: profiling workload run only by the full manual benchmark suite",
]
