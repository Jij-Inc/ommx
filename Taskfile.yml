version: '3'

includes:
  rust:
    taskfile: rust/Taskfile.yml
    dir: rust
  python:
    taskfile: python/Taskfile.yml
    dir: python
  docs:
    taskfile: docs/Taskfile.yml
    dir: docs
  proto:
    taskfile: proto/Taskfile.yml
    dir: proto
  dataset:
    taskfile: rust/dataset/Taskfile.yml
    dir: rust/dataset
  lean:
    taskfile: lean/Taskfile.yml
    dir: lean
  ci:
    taskfile: .github/Taskfile.yml
    dir: .github

tasks:
  format:
    desc: Format all management areas
    cmds:
      - task: rust:format
      - task: python:format
      - task: docs:format
      - task: proto:format
      - task: dataset:format

  format:check:
    desc: Check formatting in all management areas
    cmds:
      - task: rust:format:check
      - task: python:format:check
      - task: docs:format:check
      - task: proto:format:check
      - task: dataset:format:check

  codspeed:trigger:
    desc: Trigger the full CodSpeed suite on the current branch
    cmds:
      - gh workflow run bench.yml --ref $(git branch --show-current) --field suite=full

  codspeed:list:
    desc: List all CodSpeed workflows
    cmds:
      - gh run list --workflow=bench.yml
