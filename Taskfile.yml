# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes:
  lean:
    taskfile: lean/Taskfile.yml
    dir: lean
  book_ja:
    taskfile: docs/ja/Taskfile.yml
    dir: docs/ja
  book_en:
    taskfile: docs/en/Taskfile.yml
    dir: docs/en
  python:
    taskfile: python/Taskfile.yml
    dir: python
  rust:
    taskfile: rust/Taskfile.yml
    dir: rust
  proto:
    taskfile: proto/Taskfile.yml
    dir: proto

tasks:
  pyo3-bridge:receiver-test:
    desc: Test the receiver contract without Rust SDK or stub generator dependencies
    cmds:
      - |
        deps=$(cargo tree -p ommx-pyo3-bridge --no-default-features --edges normal,build --prefix none)
        case "$deps" in
          *"ommx v"*|*"prost v"*|*"pyo3-stub-gen v"*)
            echo 'Receiver-only bridge unexpectedly depends on an SDK or codec' >&2
            exit 1
            ;;
        esac
      - cargo test -p ommx-pyo3-bridge --no-default-features

  codspeed:trigger:
    desc: Trigger the full CodSpeed suite on the current branch
    cmds:
      - gh workflow run bench.yml --ref $(git branch --show-current) --field suite=full

  codspeed:list:
    desc: List all Codspeed workflows
    cmds:
      - gh run list --workflow=bench.yml

  pyo3-bridge:check:
    desc: Check generated PyO3 bridge stubs and fixture typing
    cmds:
      - uv sync --locked --only-group typecheck --no-install-workspace --inexact
      - cargo run -p ommx-pyo3-bridge-fixture --bin stub_gen
      - git diff --exit-code -- rust/ommx-pyo3-bridge/fixture/ommx_pyo3_bridge_fixture.pyi
      - uv run --no-sync pyright --project rust/ommx-pyo3-bridge/fixture/pyrightconfig.json

  pyo3-bridge:runtime-test:
    desc: Test conversion across independent PyO3 extension modules
    env:
      VIRTUAL_ENV: "{{.ROOT_DIR}}/.venv"
    cmds:
      - uv sync --locked --only-group build --only-group test --no-install-workspace --inexact
      - uv run --no-sync maturin develop --manifest-path rust/ommx-pyo3-bridge/fixture/Cargo.toml
      - uv run --no-sync pytest -vv rust/ommx-pyo3-bridge/fixture/tests

  pyo3-bridge:test:
    desc: Run all PyO3 bridge integration checks
    cmds:
      - task: pyo3-bridge:receiver-test
      - task: pyo3-bridge:check
      - task: pyo3-bridge:runtime-test

  format:
    desc: Format all code
    cmds:
      - task: python:format
      - task: rust:format
      - task: proto:format
