# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  doc:
    desc: Generate and Open documentation for Rust SDK
    cmds:
      - cargo doc --no-deps -p ommx -p ommx-pyo3-bridge {{.CLI_ARGS}}

  doc:check:
    desc: Run cargo doc with warnings-as-errors (CI gate against broken rustdoc)
    env:
      RUSTDOCFLAGS: -D warnings
    cmds:
      - cargo doc --no-deps -p ommx -p ommx-pyo3-bridge --features ommx/cli

  test:
    desc: Run tests for Rust SDK
    cmds:
      - cargo test -p ommx -p ommx-pyo3-bridge {{.CLI_ARGS}}

  test-all:
    desc: Run workspace Rust tests with the project's Python environment
    dir: '{{.ROOT_DIR}}'
    env:
      PYO3_PYTHON:
        sh: uv run --no-sync python -c 'import sys; print(sys.executable)'
      # Embedded CPython does not automatically activate uv's virtualenv.
      PYTHONPATH:
        sh: uv run --no-sync python -c 'import os, sys; print(os.pathsep.join(path for path in sys.path if path))'
    cmds:
      - uv run --no-sync cargo test {{.CLI_ARGS}}

  check:
    desc: Run check for Rust SDK
    cmds:
      - cargo check -p ommx -p ommx-pyo3-bridge {{.CLI_ARGS}}

  clippy:
    desc: Run clippy for Rust SDK
    cmds:
      - cargo clippy --all-targets -- -D warnings

  set-version:
    desc: Set version for Rust SDK
    cmds:
      - cargo set-version {{.CLI_ARGS}}

  format:
    desc: Format Rust code
    cmds:
      - cargo fmt --all

  insta:
    desc: Run insta snapshot tests (use --accept to accept changes)
    cmds:
      - cargo insta test {{.CLI_ARGS}}

  insta:review:
    desc: Review insta snapshot changes
    cmds:
      - cargo insta review

  insta:accept:
    desc: Run insta tests and accept all changes
    cmds:
      - cargo insta test --accept

  check:wasm32-emscripten:
    desc: Check OMMX for wasm32-unknown-emscripten target
    cmds:
      - cargo +nightly check -p ommx --target wasm32-unknown-emscripten --no-default-features
