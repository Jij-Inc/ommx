# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  default:
    cmds:
      - task: test

  test:
    desc: Run all tests for OMMX Highs Adapter
    cmds:
      - task: ::python:sync:test
      - task: pytest
      - task: pyright
      - task: markdown-code-runner
      - task: lint

  pytest:
    desc: Run pytest tests (unit only, excluding benchmark tests)
    cmds:
      - uv run --no-sync pytest -vv --doctest-modules --ignore-glob=tests/test_bench_*.py

  pyright:
    desc: Run pyright type checking
    cmds:
      - uv run --no-sync pyright

  bench:
    desc: Run HiGHS model construction regression benchmarks with CodSpeed
    cmds:
      - uv run --no-sync pytest tests/test_bench_conversion.py --codspeed

  markdown-code-runner:
    desc: Run markdown code runner
    cmds:
      - uv run --no-sync markdown-code-runner --verbose README.md

  lint:
    desc: Lint by ruff check
    cmds:
      - task: ::python:sync:lint
      - uv run --no-sync ruff check python/ommx-highs-adapter
    dir: ../..

  format:
    desc: Format ommx-highs-adapter
    cmds:
      - task: ::python:sync:lint
      - uv run --no-sync ruff format . {{.CLI_ARGS}}

  format:check:
    desc: Check ommx-highs-adapter formatting
    cmds:
      - task: format
        vars:
          CLI_ARGS: --check
