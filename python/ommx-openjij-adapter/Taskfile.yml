# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  default:
    cmds:
      - task: test

  test:
    desc: Run all tests for OMMX OpenJij Adapter
    cmds:
      - task: ::python:sync:test
      - task: pytest
      - task: pyright
      - task: markdown-code-runner
      - task: lint

  pytest:
    desc: Run pytest tests
    cmds:
      - uv run --no-sync pytest -vv --doctest-modules

  pyright:
    desc: Run pyright type checking
    cmds:
      - uv run --no-sync pyright

  markdown-code-runner:
    desc: Run markdown code runner
    cmds:
      - uv run --no-sync markdown-code-runner --verbose README.md

  lint:
    desc: Lint by ruff check
    cmds:
      - task: ::python:sync:lint
      - uv run --no-sync ruff check python/ommx-openjij-adapter
    dir: ../..

  format:
    desc: Format ommx-openjij-adapter
    cmds:
      - task: ::python:sync:lint
      - uv run --no-sync ruff format . {{.CLI_ARGS}}

  format:check:
    desc: Check ommx-openjij-adapter formatting
    cmds:
      - task: format
        vars:
          CLI_ARGS: --check
