version: '3'

includes:
  ommx:
    taskfile: ommx/Taskfile.yml
    dir: ommx
  bridge:
    taskfile: ommx-pyo3-bridge/Taskfile.yml
    dir: ommx-pyo3-bridge
  ommx-openjij-adapter:
    taskfile: ommx-openjij-adapter/Taskfile.yml
    dir: ommx-openjij-adapter
  ommx-python-mip-adapter:
    taskfile: ommx-python-mip-adapter/Taskfile.yml
    dir: ommx-python-mip-adapter
  ommx-pyscipopt-adapter:
    taskfile: ommx-pyscipopt-adapter/Taskfile.yml
    dir: ommx-pyscipopt-adapter
  ommx-highs-adapter:
    taskfile: ommx-highs-adapter/Taskfile.yml
    dir: ommx-highs-adapter

tasks:
  default:
    cmds:
      - task: test

  sync:
    desc: Build the Python SDK and prepare source-development dependencies
    dir: '{{.ROOT_DIR}}'
    cmds:
      - uv sync --locked --all-packages --all-extras

  sync:test:
    internal: true
    run: once
    cmds:
      - task: sync

  sync:lint:
    internal: true
    run: once
    dir: '{{.ROOT_DIR}}'
    cmds:
      - uv sync --locked --only-group lint --no-install-workspace --inexact

  sync:binding-test:
    internal: true
    run: once
    dir: '{{.ROOT_DIR}}'
    cmds:
      - uv sync --locked --only-group binding-test --no-install-workspace --inexact

  cargo:
    internal: true
    cmds:
      - task: sync:binding-test
      - task: cargo:run
        vars:
          CARGO_ARGS: '{{.CARGO_ARGS}}'

  cargo:run:
    internal: true
    dir: '{{.ROOT_DIR}}'
    # Evaluate after preparation. Embedded CPython needs the virtualenv search path.
    env:
      PYO3_PYTHON:
        sh: uv run --no-sync python -c 'import sys; print(sys.executable)'
      PYTHONPATH:
        sh: uv run --no-sync python -c 'import os, sys; print(os.pathsep.join(path for path in sys.path if path))'
    cmds:
      - uv run --no-sync cargo {{.CARGO_ARGS}}

  upgrade:
    desc: Upgrade Python workspace dependencies and rebuild the SDK
    dir: '{{.ROOT_DIR}}'
    cmds:
      - uv sync --all-packages --all-extras --upgrade

  test:
    desc: Validate the Python SDK, bridge, and all adapters from source
    cmds:
      - task: sync:test
      - task: ommx:test
      - task: bridge:test
      - for: [ommx-openjij-adapter, ommx-python-mip-adapter, ommx-pyscipopt-adapter, ommx-highs-adapter]
        task: '{{.ITEM}}:test'
      # Shared selection and wheel-origin checks are Python-owned too.
      - task: support:lint

  lint:
    desc: Lint all Python-managed code, including its Rust implementations
    cmds:
      - task: ommx:lint
      - task: bridge:lint
      - for: [ommx-openjij-adapter, ommx-python-mip-adapter, ommx-pyscipopt-adapter, ommx-highs-adapter]
        task: '{{.ITEM}}:lint'
      - task: support:lint

  ruff:
    desc: Run only Ruff for all Python-managed code
    cmds:
      - task: ommx:ruff
      - task: bridge:ruff
      - for: [ommx-openjij-adapter, ommx-python-mip-adapter, ommx-pyscipopt-adapter, ommx-highs-adapter]
        task: '{{.ITEM}}:lint'
      - task: support:lint

  format:
    desc: Format all Python-managed code, including Rust implementations
    cmds:
      - task: ommx:format
      - task: bridge:format
      - for: [ommx-openjij-adapter, ommx-python-mip-adapter, ommx-pyscipopt-adapter, ommx-highs-adapter]
        task: '{{.ITEM}}:format'
      - task: support:format

  format:check:
    desc: Check formatting for all Python-managed code
    cmds:
      - task: ommx:format:check
      - task: bridge:format:check
      - for: [ommx-openjij-adapter, ommx-python-mip-adapter, ommx-pyscipopt-adapter, ommx-highs-adapter]
        task: '{{.ITEM}}:format:check'
      - task: support:format:check

  support:lint:
    internal: true
    dir: '{{.ROOT_DIR}}'
    cmds:
      - task: sync:lint
      - uv run --no-sync ruff check python/scripts python/set-version.py conftest.py

  support:format:
    internal: true
    dir: '{{.ROOT_DIR}}'
    cmds:
      - task: sync:lint
      - uv run --no-sync ruff format python/scripts python/set-version.py conftest.py {{.CLI_ARGS}}

  support:format:check:
    internal: true
    cmds:
      - task: support:format
        vars:
          CLI_ARGS: --check

  set-version:
    desc: Update the SDK and adapter distribution versions
    cmds:
      - uv sync --locked --only-group maintenance --no-install-workspace --inexact
      - uv run --no-sync set-version.py {{.CLI_ARGS}}
      - uv lock
      - task: sync

  bench:
    desc: Run benchmarks for the Python SDK
    cmds:
      - task: ommx:bench

  ipython:
    desc: Open IPython in the prepared development environment
    cmds:
      - uv run --no-sync ipython
