# Pull requests run persistent guardrails once when they become ready for review.
# PRs opened as ready run immediately; draft PRs wait for `ready_for_review`.
# Pushes after that do not retrigger benchmarks: return the PR to draft and mark
# it ready again to measure the new head commit. The full suite, including
# diagnostic profiles, remains available via `task codspeed:trigger`.
# `main` and release tags also run persistent guardrails.
# Release tags (rust-*, python-*) also trigger benchmarks so each release has a
# comparison baseline against the previous release.

name: Benchmark

on:
  push:
    branches: [main]
    tags:
      - rust-*
      - python-*
  pull_request:
    types:
      - opened
      - ready_for_review
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite to run
        required: true
        default: full
        type: choice
        options:
          - guardrail
          - full

permissions:
  contents: read
  id-token: write

jobs:
  rust:
    name: Benchmarks for Rust SDK
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Environment
        uses: ./.github/actions/setup-test-environment
      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --locked
      - name: Build CodSpeed Benchmark Target(s)
        run: cargo codspeed build -p ommx --no-default-features
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5.2.1
        with:
          run: cargo codspeed run -p ommx
          mode: simulation

  python:
    name: Benchmarks for Python SDK
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # CodSpeed looks working with `sys.monitoring`, which has been introduced in 3.12,
          # but updates in 3.13 seems to be required for generating trace information.
          # https://docs.python.org/3/library/sys.monitoring.html
          python-version: ${{ env.UV_PYTHON }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build wheel
        env:
          # Keep Rust/PyO3 frames useful in CodSpeed's Python FFI flame graphs
          # without forcing debuginfo into every release build.
          CARGO_PROFILE_RELEASE_DEBUG: "true"
        run: |
          uv sync --locked --only-group build --only-group benchmark --no-install-workspace
          uv run --no-sync maturin build --release --out wheels -m python/ommx/Cargo.toml
          uv pip install wheels/*.whl

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5.2.1
        with:
          run: |
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.suite }}" = "full" ]; then
              uv run --no-sync pytest python/ommx-tests/tests/test_bench_*.py --codspeed
            else
              uv run --no-sync pytest python/ommx-tests/tests/test_bench_*.py --codspeed -m benchmark_guardrail
            fi
          mode: simulation
