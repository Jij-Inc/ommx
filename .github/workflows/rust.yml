name: Rust

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - uses: giraffate/clippy-action@v1
        with:
          reporter: github-pr-check
          github_token: ${{ github.token }}
          clippy_flags: -p ommx -p ommx-derive -p dataset --all-targets --features ommx/cli -- -Dwarnings
      - name: Check Rust SDK documentation
        run: task rust:doc:check

  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          # Add ommx-pyo3-bridge after its first crates.io publication.
          package: ommx
          features: cli

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - name: Test Rust SDK including CLI
        run: task rust:test -- --features ommx/cli
      - name: Test dataset packaging
        run: task dataset:test

  auth-e2e:
    # End-to-end coverage of the remote-artifact push pipeline and
    # the three-tier credential resolver in
    # `artifact::remote_transport::resolve_auth`. The test suite
    # (`rust/ommx/tests/auth_e2e.rs`) brings up its own ephemeral OCI
    # registries via `testcontainers` — anonymous, htpasswd-protected,
    # and one for the CLI dispatch test — so we do not need a GHA
    # `services:` declaration here. `ubuntu-latest` runners ship with
    # a running Docker daemon.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-rust

      - name: Run auth e2e tests
        run: |
          cargo test -p ommx --features remote-artifact,built,cli --test auth_e2e \
            -- --include-ignored --test-threads=1

  wasm-emscripten:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-emscripten
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}

      - name: Check OMMX for wasm32-unknown-emscripten
        run: task rust:check:wasm32-emscripten
