name: Buf

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  breaking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: Check breaking changes
        run: buf breaking proto --against '.git#branch=origin/main,subdir=proto' --error-format=github-actions

  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
      - uses: arduino/setup-protoc@v3
        with:
          version: '26.1'
          repo-token: ${{ github.token }}
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - name: Lint generator
        run: cargo clippy -p protogen --all-targets -- -D warnings
      - name: Test and regenerate Protobuf messages
        run: task proto:test
