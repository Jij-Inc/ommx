name: Python

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - name: Lint binding implementation
        run: task python:ommx:clippy
      - name: Test binding implementation
        run: task python:ommx:test-rust

      - name: Regenerate stub files
        run: task python:ommx:stubgen

      - name: Check generated files
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- python/ommx/ommx docs/api)" ]; then
            git status --short --untracked-files=all -- python/ommx/ommx docs/api
            exit 1
          fi

  pyright:
    runs-on: ubuntu-latest
    needs: build-wheel
    env:
      UV_NO_SYNC: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-3.11
          path: wheels
      - name: Install locked typing dependencies
        run: >-
          uv sync --locked --all-packages --no-install-package ommx
          --no-default-groups --group sdk-test
      - name: Install SDK wheel
        run: uv pip install --python .venv --no-deps wheels/ommx-*.whl
      - name: Run Pyright
        run: task python:ommx:pyright
      - name: Verify installed SDK wheel
        run: uv run --no-sync python python/scripts/check-installed-wheel.py wheels

  build-wheel:
    name: Build Wheel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/setup-rust
      - name: Initialise uv
        run: uv venv -p ${{ matrix.python-version }}
      - name: Build ommx wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >
            --strip
            --out wheels
            -m python/ommx/Cargo.toml
            --interpreter ${{ matrix.python-version }}
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.python-version }}
          path: wheels

  # Test each wheel across its supported Python versions and GIL modes.
  test:
    name: test (${{ matrix.python-version }})
    env:
      UV_NO_SYNC: '1' # uv run must keep using the installed wheel.
      PYTEST_ADDOPTS: ${{ endsWith(matrix.python-version, 't') && '--require-gil-disabled' || '' }}
      ADAPTER_COMPARISON_DOCTEST: python/ommx/tests/test_doctests.py::test_doctest[ommx.adapter]
    runs-on: ubuntu-latest
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.15"
            wheel: wheels-3.15
          - python-version: "3.15t"
            wheel: wheels-3.15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.wheel || 'wheels-3.11' }}
          path: wheels
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - name: Select adapters for this interpreter
        run: |
          adapters=$(uv run --no-project python/scripts/select-python-adapters.py "${{ matrix.python-version }}")
          echo "ADAPTERS=$adapters" >> "$GITHUB_ENV"
      - name: Install locked test dependencies
        shell: bash
        run: |
          packages=(--package ommx)
          for adapter in $ADAPTERS; do
            packages+=(--package "${adapter}")
          done
          uv sync --locked --no-install-package ommx --no-default-groups \
            --group sdk-test --group lint "${packages[@]}"
      - name: Install SDK wheel
        run: uv pip install --python .venv --no-deps wheels/ommx-*.whl
      - name: Check installed dependencies
        run: uv pip check --python .venv
      - name: Test SDK
        run: |
          if [[ -n "$PYTEST_ADDOPTS" ]]; then
            # This example imports PySCIPOpt, which currently enables the GIL.
            export PYTEST_ADDOPTS="$PYTEST_ADDOPTS --deselect=$ADAPTER_COMPARISON_DOCTEST"
          fi
          task python:ommx:pytest
      - name: Test SDK comparison of solver adapters in a separate process
        if: endsWith(matrix.python-version, 't')
        env:
          # Enforce the same contract once both participants declare support.
          PYTEST_ADDOPTS: ${{ contains(env.ADAPTERS, 'ommx-highs-adapter') && contains(env.ADAPTERS, 'ommx-pyscipopt-adapter') && '--require-gil-disabled' || '' }}
        run: uv run --no-sync pytest -v "$ADAPTER_COMPARISON_DOCTEST"
      - name: Test selected adapters
        if: env.ADAPTERS != ''
        run: |
          for adapter in $ADAPTERS; do
            task "python:${adapter}:pytest" "python:${adapter}:pyright" "python:${adapter}:markdown-code-runner" "python:${adapter}:lint"
          done

      - name: Verify the downloaded SDK wheel is still installed
        run: uv run --no-sync python python/scripts/check-installed-wheel.py wheels

  # The Rust bridge integration tests reuse the SDK wheel independently of
  # the SDK's Python version matrix.
  pyo3-bridge:
    name: PyO3 bridge integration
    runs-on: ubuntu-latest
    needs: build-wheel
    env:
      UV_NO_SYNC: '1' # uv run must keep using the installed wheel.
    steps:
      - uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-3.11
          path: wheels
      - name: Install locked bridge test dependencies
        run: >-
          uv sync --locked --package ommx --no-install-package ommx
          --no-default-groups --group build --group test --group typecheck
      - name: Install SDK wheel
        run: uv pip install --python .venv --no-deps wheels/ommx-*.whl
      - name: Check installed dependencies
        run: uv pip check --python .venv
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - name: Validate bridge and fixture Rust code
        run: task python:bridge:lint python:bridge:test-rust python:bridge:receiver-test python:bridge:doc:check
      - name: Check PyO3 bridge generated stub and typing
        run: task python:bridge:check
      - name: Test PyO3 bridge across extension boundary
        run: task python:bridge:runtime-test
      - name: Verify the downloaded SDK wheel is still installed
        run: uv run --no-sync python python/scripts/check-installed-wheel.py wheels

  # Test Sphinx documentation with code execution
  test-book:
    runs-on: ubuntu-latest
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        lang: [ja, en]
    env:
      python-version: "3.12"
      UV_NO_SYNC: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.python-version }}
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-3.11
          path: wheels
      - name: Install locked Book dependencies
        run: >-
          uv sync --locked --all-packages --no-default-groups
          --group docs --group tutorials --no-install-package ommx
      - name: Install SDK wheel
        run: uv pip install --python .venv --no-deps wheels/ommx-*.whl
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - name: Test Book (${{ matrix.lang }})
        run: task docs:${{ matrix.lang }}:test
      - name: Verify installed SDK wheel
        run: uv run --no-sync python python/scripts/check-installed-wheel.py wheels
