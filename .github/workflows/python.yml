name: Python

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stub-gen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-test-environment

      - name: Regenerate stub files
        run: task python:stubgen

      - name: Check generated files
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- python/ommx/ommx docs/api)" ]; then
            git status --short --untracked-files=all -- python/ommx/ommx docs/api
            exit 1
          fi

  # uv run and maturin develop/build doesn't work well together-
  # Even if one runs maturin develop once, uv run pyright
  # will rebuild the extension, and if we run uv run --no-build pyright,
  # it will fail to find the extension.
  # So, it is better to run pyright separately from the wheel building job.
  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Environment
        uses: ./.github/actions/setup-test-environment
      - name: Run Pyright
        run: task python:ommx:pyright

  build-wheel:
    name: Build Wheel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14t", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-test-environment
        with:
          python-version: ${{ matrix.python-version }}
      - name: Initialise uv
        run: uv venv -p ${{ matrix.python-version }}
      - name: Build ommx wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >
            --strip
            --out wheels
            -m python/ommx/Cargo.toml
            --interpreter ${{ matrix.python-version }}
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.python-version }}
          path: wheels

  # Test each wheel across its supported Python versions and GIL modes.
  test:
    runs-on: ubuntu-latest
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # OpenJij and its dependencies do not support Python 3.15 yet.
          - python-version: "3.15"
            test-scope: --sdk-only
          - python-version: "3.14t"
            test-scope: --sdk-only
          - python-version: "3.15t"
            test-scope: --sdk-only
    steps:
      - uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-test-environment
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheels
      - name: Transform Python Project to run tests
        run: |
          # Keep the project-rewrite tooling independent of the target Python.
          uv sync --python 3.11 --locked --only-group maintenance --no-install-workspace
          uv run --python 3.11 --no-sync ci-scripts/setup-python-test-project.py ${{ matrix.python-version }} ${{ matrix.test-scope }}
          cat pyproject.toml
      - name: Install deps
        run: task python:sync
      - name: Test
        run: task python:test-ci

      - name: Check PyO3 bridge generated stub and typing
        if: matrix.python-version == '3.11'
        run: task pyo3-bridge:check

      - name: Test PyO3 bridge across extension boundary
        run: task pyo3-bridge:runtime-test

  # Test Sphinx documentation with code execution
  test-book:
    runs-on: ubuntu-latest
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        lang: [ja, en]
    env:
      python-version: "3.12"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-test-environment
        with:
          python-version: ${{ env.python-version }}
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheels
      - name: Transform Python Project to run tests
        run: |
          # Keep the project-rewrite tooling independent of the target Python.
          uv sync --python 3.11 --locked --only-group maintenance --no-install-workspace
          uv run --python 3.11 --no-sync ci-scripts/setup-python-test-project.py ${{ env.python-version }}
          cat pyproject.toml
      - name: Install deps
        run: task python:sync
      - name: Test Book (${{ matrix.lang }})
        run: task python:book:test:${{ matrix.lang }}

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-test-environment

      - name: Install lint tools
        run: uv sync --locked --only-group lint --no-install-workspace

      - name: Format
        run: uv run --no-sync ruff format --check python

      - name: Lint
        run: uv run --no-sync ruff check python

      - name: Test CI project setup
        run: |
          uv sync --locked --only-group maintenance --no-install-workspace --inexact
          uv run --no-sync python -m unittest discover -s ci-scripts/tests
