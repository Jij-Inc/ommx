name: Python

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protogen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-test-environment

      - name: Regenerate python bindings
        run: task proto:python

      - name: Check updated
        run: |
          git add -N python/ommx/ommx/  # To check newly generated files
          git diff --exit-code

  stub-gen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-test-environment

      - name: Regenerate stub file
        run: task python:stubgen

      - name: Check updated
        run: |
          git diff --exit-code python/ommx/ommx/_ommx_rust.pyi

  # uv run and maturin develop/build doesn't work well together-
  # Even if one runs maturin develop once, uv run pyright
  # will rebuild the extension, and if we run uv run --no-build pyright,
  # it will fail to find the extension.
  # So, it is better to run pyright separately from the wheel building job.
  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Environment
        uses: ./.github/actions/setup-test-environment
      - name: Run Pyright
        run: task python:ommx:pyright

  build-wheel:
    name: Build Wheel
    runs-on: ubuntu-latest
    env:
      python-version: 3.12
    steps:
      - uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-test-environment
        with:
          python-version: ${{ env.python-version }}
      - name: Initialise uv
        run: uv venv -p ${{env.python-version}}
      - name: Build ommx wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >
            --locked
            --out wheels
            -m python/ommx/Cargo.toml
      - name: Upload SDK wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: wheels/ommx-*.whl

  bridge:
    name: Test Rust v3 bridge
    runs-on: ubuntu-latest
    needs: build-wheel
    env:
      python-version: 3.12
    steps:
      - uses: actions/checkout@v6
      - name: Setup Environment
        uses: ./.github/actions/setup-test-environment
        with:
          python-version: ${{ env.python-version }}
      - name: Initialise uv
        run: uv venv -p ${{ env.python-version }}
      - name: Download SDK wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels
          path: wheels
      - name: Check generated sender stub
        run: |
          PYO3_PYTHON="$PWD/.venv/bin/python" cargo run --locked -p bridge-test-modeling --bin stub_gen
          uvx --from 'ruff==0.9.10' ruff format python/bridge-tests/modeling/bridge_test_modeling.pyi
          git diff --exit-code -- python/bridge-tests/modeling/bridge_test_modeling.pyi
      - name: Build sender wheel
        run: >
            uvx --from 'maturin>=1.12.2,<2' maturin build
            --locked --out wheels
            --interpreter .venv/bin/python
            -m python/bridge-tests/modeling/Cargo.toml
      - name: Use built wheels in the Python workspace
        run: uv run ci-scripts/setup-python-test-project.py ${{ env.python-version }} --bridge-wheel wheels/bridge_test_modeling-*.whl
      - name: Install dependencies
        run: task python:sync
      - name: Type check bridge integration
        run: uv run pyright python/bridge-tests
      - name: Test bridge integration
        run: uv run pytest -v python/bridge-tests

  # Test a single wheel with multiple python versions
  test:
    runs-on: ubuntu-latest
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-test-environment
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels
          path: wheels
      - name: Transform Python Project to run tests
        run: |
          uv run ci-scripts/setup-python-test-project.py ${{ matrix.python-version }}
          cat pyproject.toml
      - name: Install deps
        run: task python:sync
      - name: Test
        run: task python:test-ci

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-test-environment

      - name: Format
        run: uvx ruff format --check python

      - name: Lint
        run: uvx ruff check python
