name: Python

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stub-gen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-test-environment

      - name: Regenerate stub files
        run: task python:stubgen

      - name: Check generated files
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- python/ommx/ommx docs/api)" ]; then
            git status --short --untracked-files=all -- python/ommx/ommx docs/api
            exit 1
          fi

  # uv run and maturin develop/build doesn't work well together-
  # Even if one runs maturin develop once, uv run pyright
  # will rebuild the extension, and if we run uv run --no-build pyright,
  # it will fail to find the extension.
  # So, it is better to run pyright separately from the wheel building job.
  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Environment
        uses: ./.github/actions/setup-test-environment
      - name: Run Pyright
        run: task python:ommx:pyright

  build-wheel:
    name: Build Wheel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14t", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-test-environment
        with:
          python-version: ${{ matrix.python-version }}
      - name: Initialise uv
        run: uv venv -p ${{ matrix.python-version }}
      - name: Build ommx wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >
            --strip
            --out wheels
            -m python/ommx/Cargo.toml
            --interpreter ${{ matrix.python-version }}
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.python-version }}
          path: wheels

  # Test each wheel across its supported Python versions and GIL modes.
  test:
    name: test (${{ matrix.python-version }})
    env:
      UV_NO_SYNC: '1' # uv run must keep using the installed wheel.
      ADAPTERS: ${{ join(matrix.adapters, ' ') }}
    runs-on: ubuntu-latest
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # Adapter suites to run alongside the SDK on the four versions above.
          - adapters: [openjij, python-mip, pyscipopt, highs]
          - python-version: "3.15"
            wheel: wheels-3.15
            adapters: []
          - python-version: "3.14t"
            wheel: wheels-3.14t
            adapters: []
          - python-version: "3.15t"
            wheel: wheels-3.15
            adapters: []
    steps:
      - uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-test-environment
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.wheel || 'wheels-3.11' }}
          path: wheels
      - name: Install locked test dependencies
        shell: bash
        run: |
          packages=(--package ommx)
          for adapter in $ADAPTERS; do
            packages+=(--package "ommx-${adapter}-adapter")
          done
          uv sync --locked --no-install-package ommx --no-default-groups \
            --group sdk-test --group lint "${packages[@]}"
      - name: Install SDK wheel
        run: uv pip install --python .venv --no-deps wheels/ommx-*.whl
      - name: Check installed dependencies
        run: uv pip check --python .venv
      - name: Test SDK
        run: task python:ommx:pytest
      - name: Test selected adapters
        if: env.ADAPTERS != ''
        run: |
          for adapter in $ADAPTERS; do
            task "python:ommx-${adapter}-adapter:test"
          done

      - name: Check PyO3 bridge generated stub and typing
        if: matrix.python-version == '3.11'
        run: task pyo3-bridge:check

      - name: Test PyO3 bridge across extension boundary
        run: task pyo3-bridge:runtime-test

      - name: Verify the downloaded SDK wheel is still installed
        run: |
          uv run --no-sync python - <<'PY'
          from importlib.metadata import distribution
          import json
          from pathlib import Path

          wheel, = Path("wheels").glob("ommx-*.whl")
          source = json.loads(distribution("ommx").read_text("direct_url.json"))
          assert source["url"] == wheel.resolve().as_uri(), source
          PY

  # Test Sphinx documentation with code execution
  test-book:
    runs-on: ubuntu-latest
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        lang: [ja, en]
    env:
      python-version: "3.12"
      UV_NO_SYNC: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-test-environment
        with:
          python-version: ${{ env.python-version }}
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-3.11
          path: wheels
      - name: Install locked Book dependencies
        run: >-
          uv sync --locked --all-packages --no-default-groups
          --group docs --group tutorials --no-install-package ommx
      - name: Install SDK wheel
        run: uv pip install --python .venv --no-deps wheels/ommx-*.whl
      - name: Test Book (${{ matrix.lang }})
        run: task python:book:test:${{ matrix.lang }}
      - name: Check published entry links (${{ matrix.lang }})
        run: uv run --no-sync python ci-scripts/check-book-entry-links.py ${{ matrix.lang }} docs/${{ matrix.lang }}/_build/html

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-test-environment

      - name: Install lint tools
        run: uv sync --locked --only-group lint --no-install-workspace

      - name: Format
        run: uv run --no-sync ruff format --check python ci-scripts

      - name: Lint
        run: uv run --no-sync ruff check python ci-scripts
